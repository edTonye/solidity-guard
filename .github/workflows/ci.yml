name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Install solc
        run: python -m solidity_guard.install_compiler

      - name: Run tests
        run: pytest -v

      - name: Smoke test CLI on vulnerable fixtures
        run: solidity-guard tests/fixtures/vulnerable

      - name: Smoke test CLI on safe fixtures
        run: solidity-guard tests/fixtures/safe
